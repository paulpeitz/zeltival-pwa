<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeltival 2026</title>
  <link rel="canonical" href="https://paulpeitz.github.io/zeltival-pwa/" />
  <link rel="manifest" href="/zeltival-pwa/manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  		<style>
			body {
				font-size:14px;
				font-family: "Epilogue", "Open Sans", Arial, Helvetica, "Helvetica Neue", sans-serif;
				background-image: url('img/Zeltival_2026_bg.jpg');
				background-repeat: no-repeat;
				background-size: 1920px 1080px;
				background-position: center;
				background-attachment: fixed;
				color: #333333;			
			}
			
			img {
				border-radius: 0%;
			}
					
			.wrapper {
				display: grid;
				grid-template-columns: 20% 20% 20% 20% 20%;
				margin-left: 174px;
				margin-top: 0px;
				margin-right: 20px;

			}

			.song {
				border: 0px;
				width: 80%;
				padding-bottom: 10px
			}

			.titel {
				font-size: 16px;
				font-weight: bold; 
			}

			.datum {
				font-size: 14px;
				font-weight: bold;
			}

			.box {
				color: #333333;
				border-radius: 10px;
				padding: 10px;
				font-size: 150%;
				text-align: center;
			}
			
			.header {
			  position: sticky;
			  top: 0;
			  font-size: 1px;
			  font-weight: bold;
			  margin-left: 0px;
			  text-align: center;
			}
			
		</style>

</head>
<body>
 
  <h1>Zeltival 2026</h1>
  <p>
    This is a PWA template for GitHub pages. 
    Make sure to check the README at 
    <a href="https://github.com/codepo8/github-page-pwa/">https://github.com/codepo8/github-page-pwa/</a> and 
    to change the necessary settings to your needs.
  </p>

  <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker.register (
          '/zeltival-pwa/sw.js',
          {scope: '/zeltival-pwa/'}
        )
      }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
